<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELA - Sign Up</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui} body{background:#f5f7f5;padding:16px}
.box{background:white;max-width:400px;margin:20px auto;padding:20px;border-radius:16px}
h2{font-size:22px} h2 span{color:#facc15}
.inp{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:10px;font-size:15px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;background:#111827;color:white;font-weight:900;margin-top:12px;font-size:15px}
.btn:disabled{opacity:.6}
#msg{text-align:center;margin-top:10px;font-size:14px}
</style></head><body>
<div class="box">
<h2>VELA<span>.</span> Sign Up</h2>
<p style="font-size:13px;color:#666">Create real VELA account. You will see it in Firebase.</p>

<input id="suName" class="inp" placeholder="Full Name">
<input id="suPhone" class="inp" placeholder="Phone 0783663151" type="tel">
<input id="suEmail" class="inp" placeholder="Email - e.g. elisa@gmail.com" type="email">
<input id="suPass" class="inp" placeholder="Password 6+ characters" type="password">

<button id="suBtn" class="btn" onclick="doSignUp()">Create Account</button>
<button class="btn" style="background:#f3f4f6;color:#111827" onclick="doSignIn()">Already have account? Sign In</button>
<p id="msg"></p>
<p id="debug" style="font-size:11px;color:#999;text-align:center"></p>
</div>

<script>
// SAME FIREBASE AS YOUR SITE
const firebaseConfig={apiKey:"AIzaSyCLHrYWH31Nu6hZZyl3fXpdrtbJapAVzdI",authDomain:"vela-search.firebaseapp.com",projectId:"vela-search",storageBucket:"vela-search.firebasestorage.app",messagingSenderId:"713874060645",appId:"1:713874060645:web:44ac156cc34ef3cfee5d8c"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

async function doSignUp(){
  const name=document.getElementById("suName").value.trim();
  const phone=document.getElementById("suPhone").value.trim();
  const email=document.getElementById("suEmail").value.trim();
  const pass=document.getElementById("suPass").value;
  const msg=document.getElementById("msg");
  const btn=document.getElementById("suBtn");

  if(!name||!phone||!email||pass.length<6){
    msg.style.color="red";
    msg.innerText="❌ Fill all: Name, Phone, Email, Password 6+";
    return;
  }
  btn.disabled=true; btn.innerText="Creating..."; msg.innerText="";

  try{
    // 1. REAL FIREBASE AUTH - THIS APPEARS IN AUTHENTICATION TAB
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;

    // 2. REAL FIRESTORE DATA - THIS APPEARS IN FIRESTORE TAB
    await db.collection("vela_users").doc(uid).set({
      name: name,
      phone: phone,
      email: email,
      created: Date.now(),
      verified: true
    });

    msg.style.color="green";
    msg.innerText="✅ SUCCESS! UID: "+uid+" - Check Firebase now";
    document.getElementById("debug").innerText="Email: "+email+" | UID: "+uid;
    btn.innerText="✅ Account Created";

  }catch(e){
    btn.disabled=false; btn.innerText="Create Account";
    msg.style.color="red";
    // Show REAL Firebase error, not fake message
    msg.innerText="❌ Firebase says: "+e.message;
    document.getElementById("debug").innerText="Error code: "+e.code;
  }
}

async function doSignIn(){
  const email=document.getElementById("suEmail").value.trim();
  const pass=document.getElementById("suPass").value;
  const msg=document.getElementById("msg");
  try{
    const cred=await auth.signInWithEmailAndPassword(email, pass);
    msg.style.color="green";
    msg.innerText="✅ Signed in! UID: "+cred.user.uid;
  }catch(e){
    msg.style.color="red";
    msg.innerText="❌ Firebase says: "+e.message;
  }
}

// This proves if someone is logged in
auth.onAuthStateChanged(u=>{
  if(u) document.getElementById("debug").innerText="Logged in as: "+u.email+" | UID: "+u.uid;
});
</script></body></html>
