<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELA - Nakivale Market</title>
<style>
body{font-family:system-ui;background:#f3f4f6;margin:0;padding:12px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.btn{padding:13px;border-radius:10px;border:none;width:100%;font-weight:bold;margin-top:10px;cursor:pointer}
.btn-momo{background:black;color:#ffcc00;font-size:15px}
.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:bold;float:right}
.awaiting{background:#fff3cd;color:#856404}
.paid{background:#cce5ff;color:#004085}
.completed{background:#d4edda;color:#155724}
.ref{background:#eee;padding:4px 8px;border-radius:6px;font-family:monospace;font-weight:bold}
.pay-box{background:#fffbe6;border:1px dashed #ffcc00;border-radius:10px;padding:12px;margin-top:12px}
</style>
</head>
<body>

<h2>🛒 VELA - Orders</h2>
<div id="orders"></div>

<script>
const MOMO_MERCHANT_CODE = "47852783";
const COMMISSION_RATE = 0.05;

function calcCommission(amount){
  let commission = Math.round(amount * COMMISSION_RATE);
  let sellerPay = amount - commission;
  return {commission, sellerPay};
}

// Check if admin ?admin=1 in URL - only you see profit
const isAdmin = window.location.search.includes("admin=1");

let orders = [
 {id:"XrbJC", product:"Baskets", amount:8000, status:"awaiting_payment"},
 {id:"E6X6b", product:"Mats", amount:11000, status:"paid"},
 {id:"Ftzl1", product:"Jugs", amount:6000, status:"completed"},
];

function render(){
 let html = "";
 orders.forEach(o=>{
  let calc = calcCommission(o.amount);
  html+=`<div class="card">
   <span class="badge ${o.status=='awaiting_payment'?'awaiting':o.status=='paid'?'paid':'completed'}">
    ${o.status=='awaiting_payment'?'Awaiting Payment':o.status=='paid'?'Paid':'Completed'}
   </span>
   <b>${o.product}</b> - ${o.amount} UGX<br><br>
   Ref: <span class="ref">VELA-${o.id}</span>`;

  // ADMIN ONLY - you see profit
  if(isAdmin){
   html+=`<div style="background:#f0fdf4;border:1px solid #22c55e;border-radius:8px;padding:8px;margin-top:8px;font-size:13px">
   ADMIN: Profit ${calc.commission} UGX | Seller ${calc.sellerPay} UGX</div>`;
  }

  if(o.status=='awaiting_payment'){
   html+=`
   <div class="pay-box">
     <b>Pay to VELA (Escrow):</b><br>
     Dial <b>*165*3*${MOMO_MERCHANT_CODE}*${o.amount}#</b><br>
     <small>MoMo Pay Code: ${MOMO_MERCHANT_CODE}</small>
   </div>
   <button class="btn btn-momo" onclick="confirmPay('${o.id}')">I Have Paid to ${MOMO_MERCHANT_CODE}</button>
   `;
  }
  if(o.status=='paid'){
   html+=`<p style="font-size:13px;margin-top:12px">✅ Paid to VELA. Seller is delivering your order.</p>`;
   if(isAdmin){
    html+=`<button class="btn btn-momo" style="background:#0d7a3a;color:white" onclick="release('${o.id}')">ADMIN: Release to Seller</button>`;
   }
  }
  if(o.status=='completed'){
   html+=`<p style="font-size:13px;margin-top:12px">✅ Order completed.</p>`;
  }
  html+=`</div>`;
 });
 document.getElementById("orders").innerHTML=html;
}

function confirmPay(id){
 let tx = prompt("Enter MoMo Transaction ID after paying to 47852783 for VELA-"+id);
 if(tx){
  alert("Thank you! TxID "+tx+" received for VELA-"+id+". We will verify and deliver.");
  let order = orders.find(o=>o.id==id);
  if(order) order.status='paid';
  render();
 }
}
function release(id){ 
 let order = orders.find(o=>o.id==id);
 if(order){ order.status='completed'; render(); }
}

render();
</script>

<div style="background:black;color:#ffcc00;padding:14px;border-radius:12px;text-align:center;margin-top:20px">
<b>VELA</b><br>MoMo Pay: *165*3*47852783#<br>Code: 47852783<br>Nakivale / Isingiro
</div>

</body>
</html>
