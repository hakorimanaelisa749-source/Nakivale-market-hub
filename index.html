<style>
body{font-family:system-ui;background:#f3f4f6;margin:0;padding:12px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.btn{padding:13px;border-radius:10px;border:none;width:100%;font-weight:bold;margin-top:10px;cursor:pointer}
.btn-momo{background:black;color:#ffcc00;font-size:15px}

.completed{background:#d4edda;color:#155724}
.ref{background:#eee;padding:4px 8px;border-radius:6px;font-family:monospace;font-weight:bold}
.pay-box{background:#fffbe6;border:2px dashed #ffcc00;border-radius:10px;padding:12px;margin-top:12px}
.amb-banner{background:black;color:#ffcc00;padding:10px;text-align:center;font-size:13px;position:sticky;top:0;z-index:99}
</style>

<body>

<div id="ambTop"></div>

<h2>🛒 VELA Uganda</h2>
<p style="font-size:13px;color:#666">Pay safely to MoMo Pay 47852783 - Escrow protected</p>

<div id="orders"></div>

<script>
const MOMO_MERCHANT_CODE = "47852783";
const COMMISSION_RATE = 0.05;
const isAdmin = window.location.search.includes("admin=1");

// ===== AMBASSADOR CODE SYSTEM =====
function getAmbassadorCode(){
  let urlParams = new URLSearchParams(window.location.search);
  let ref = urlParams.get('ref');
  if(ref){
    ref = ref.toUpperCase().replace(/[^A-Z0-9]/g,''); // clean JOSE10
    localStorage.setItem('vela_ref', ref);
    return ref;
  }
  return localStorage.getItem('vela_ref') || "DIRECT";
}

function calcCommission(amount){
  let commission = Math.round(amount * COMMISSION_RATE);
  let sellerPay = amount - commission;
  return {commission, sellerPay};
}

let orders = [
 {id:"XrbJC", product:"Baskets", amount:8000, status:"awaiting_payment"},
 {id:"E6X6b", product:"Mats", amount:11000, status:"paid"},
 {id:"Ftzl1", product:"Jugs", amount:6000, status:"completed"},
];

function render(){
  let ref = getAmbassadorCode();
  
  // Show ambassador banner for customer
  if(ref !== "DIRECT"){
    document.getElementById("ambTop").innerHTML = `<div class="amb-banner">✅ You came from Ambassador: <b>${ref}</b> - Trusted VELA Partner! Pay to 47852783</div>`;
  } else {
    document.getElementById("ambTop").innerHTML = "";
  }

  let html = "";
  orders.forEach(o=>{
    let calc = calcCommission(o.amount);
    html+=`<div class="card">
     <span class="badge ${o.status=='awaiting_payment'?'awaiting':o.status=='paid'?'paid':'completed'}">
      ${o.status=='awaiting_payment'?'Awaiting Payment':o.status=='paid'?'Paid - Delivering':'Completed'}
     </span>
     <b>${o.product}</b> - ${o.amount} UGX<br><br>
     Ref: <span class="ref">VELA-${o.id}</span>`;

    // ADMIN ONLY VIEW - profit hidden from customers
    if(isAdmin){
     html+=`<div style="background:#f0fdf4;border:1px solid #22c55e;border-radius:8px;padding:8px;margin-top:8px;font-size:12px">
     ADMIN VIEW ONLY:<br>
     Ambassador Code: <b>${ref}</b><br>
     Your Profit 5%: ${calc.commission} UGX | Seller gets: ${calc.sellerPay} UGX<br>
     ${ref!=="DIRECT" ? `Pay Ambassador ${ref}: ${Math.round(calc.commission*0.4)} UGX (40% of your profit)` : ''}</div>`;
    }

    if(o.status=='awaiting_payment'){
     html+=`
     <div class="pay-box">
       <b>Pay to VELA Escrow (Safe):</b><br>
       Dial <b>*165*3*${MOMO_MERCHANT_CODE}*${o.amount}#</b><br>
       <small>Code: ${MOMO_MERCHANT_CODE} | Ref: VELA-${o.id}</small><br>
       <small style="color:#856404">Your Code: ${ref} will be saved</small>
     </div>
     <button class="btn btn-momo" onclick="confirmPay('${o.id}',${o.amount})">I Have Paid to ${MOMO_MERCHANT_CODE}</button>
     `;
    }
    if(o.status=='paid'){
     html+=`<p style="font-size:13px;margin-top:12px">✅ Paid to VELA. Delivery in progress.</p>`;
     if(isAdmin) html+=`<button class="btn btn-momo" style="background:#0d7a3a;color:white" onclick="release('${o.id}')">ADMIN: Release ${calc.sellerPay} UGX to Seller</button>`;
    }
    if(o.status=='completed'){
     html+=`<p style="font-size:13px;margin-top:12px">✅ Completed - Thank you!</p>`;
    }
    html+=`</div>`;
  });
  document.getElementById("orders").innerHTML=html;
}

function confirmPay(id, amount){
  let ref = getAmbassadorCode();
  let tx = prompt(`Enter MoMo Transaction ID for VELA-${id}\nPaid to 47852783\nYour Code: ${ref}\n\nWe will verify amount ${amount} UGX`);
  if(tx){
    // SAVE THIS TO FIREBASE - This is what tracks ambassador
    let orderData = {
      orderId: `VELA-${id}`,
      amount: amount,
      merchantCode: MOMO_MERCHANT_CODE,
      ambassadorCode: ref, // JOSE10 etc - THIS TRACKS HIM
      txId: tx,
      status: "paid",
      timestamp: new Date().toISOString()
    };
    console.log("SAVE TO FIREBASE:", orderData);
    alert(`Thank you! Order VELA-${id} received.\nCode: ${ref} saved.\nWe verify payment to 47852783 and deliver.`);
    let order = orders.find(o=>o.id==id);
    if(order) order.status='paid';
    render();
  }
}

function release(id){
  let order = orders.find(o=>o.id==id);
  if(order){ order.status='completed'; render(); }
}

render();
</script>
